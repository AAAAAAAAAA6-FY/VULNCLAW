# P1-3 (2026-09-15)：Prototype Pollution gadget 指纹库。
# 供 engines/web_advanced_engines.PrototypePollutionEngine 引用：
# 已 verified 的原型污染若命中下列服务端框架/库指纹 → 升级为「gadget 链路可用」。
pp_gadget_fingerprints:
  frameworks:
  - pattern: express
    description: Express.js (Node) —— 查询串/JSON 体原型污染主战场
  - pattern: node\.js
    description: Node.js 运行时
  - pattern: \bkoa\b
    description: Koa (Node)
  - pattern: lodash
    description: lodash <4.17.21 存在 PP (CVE-2020-8203)，可经 template/merge gadget 升级
  - pattern: \bjquery\b
    description: jQuery <3.4.0 $.extend(true,...) PP (CVE-2019-11358)，可升级 XSS
  - pattern: \bhandlebars\b
    description: Handlebars PP 可 RCE (CVE-2021-23369)
  - pattern: \bmustache\b
    description: mustache 模板引擎 PP gadget
  - pattern: \bvue\b
    description: Vue.js —— PP 可影响模板编译
  - pattern: \bmongoose\b
    description: Mongoose —— PP 可影响查询条件
  - pattern: \bmoment\b
    description: moment.js PP gadget

