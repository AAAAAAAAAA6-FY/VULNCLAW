    author: community
    cve: CVE-2021-44228
    severity: critical
    tested: true
    description: Apache Log4j JNDI 注入检测

  - name: grafana-auth-bypass
    author: community
    cve: CVE-2023-3128
    severity: high
    tested: false
    description: Grafana 认证绕过检测

  - name: jenkins-unauth-script-console
    author: community
    cve: CVE-2024-23897
    severity: high
    tested: false
    description: Jenkins 未授权脚本控制台检测

  - name: kibana-timelion-rce
    author: community
