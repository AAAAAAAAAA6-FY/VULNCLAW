# 社区模板仓库索引（v105 雏形）
#
# 字段说明：
#   name          模板名称（唯一标识）
#   author        贡献者
#   cve           关联 CVE 编号（无则留空）
#   severity      严重性（critical/high/medium/low/info）
#   tested        测试状态（true=已验证通过 / false=待验证）
#   description   模板用途简述
#
# 贡献方式：在 templates 下追加条目并补充模板 YAML 到对应分类目录。
version: 0.1.0
templates:
