[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnclaw"
version = "0.1.0"
description = "AI-driven penetration testing platform"
readme = "README.md"
license = {text = "AGPL-3.0-or-later WITH Classpath-exception-2.0"}
authors = [{name = "VULNCLAW Contributors"}]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "aiofiles",
    "beautifulsoup4",
    "dnspython",
    "redis>=5.0",
    "tqdm",
    "python-whois>=0.9.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pre-commit", "pytest", "pytest-cov", "pytest-asyncio"]

[project.scripts]
vulnclaw = "vulnclaw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnclaw" = ["data/**/*", "templates/**/*"]

[tool.ruff]
line-length = 140
target-version = "py311"
cache-dir = "_runtime_cache/ruff"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
cache_dir = "_runtime_cache/pytest"

[tool.coverage.run]
source = ["src/vulnclaw"]

[tool.mypy]
strict = false
ignore_missing_imports = true
