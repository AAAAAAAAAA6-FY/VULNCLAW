[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnclaw"
version = "0.1.0"
description = "AI-driven penetration testing platform"
readme = "README.md"
license = {text = "AGPL-3.0-or-later WITH Classpath-exception-2.0"}
authors = [{name = "VULNCLAW Contributors"}]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "pydantic>=2.0.0",
    # 2.15+ 保证 Field alias / env alias 行为稳定；对应 Dependabot PR #7
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.0",
    # 6.0.3 含 CVE 安全补丁；对应 Dependabot PR #3
    "pyyaml>=6.0.3",
    "psutil>=5.9.0",
    # 2.34+ cookie/SSL 默认行为已回归验证；对应 Dependabot PR #4
    "requests>=2.34.2",
    # P0-1 HTTP/2 后端（httpx[http2] 含 h2 协议库；未装时 http2_enabled()=False 自动降级 aiohttp）
    "httpx[http2]>=0.27.0",
    "aiofiles",
    "beautifulsoup4",
    "dnspython",
    "redis>=8.1.0",
    "tqdm",
    # 0.9.6 修复 TLD 解析边界情况；对应 Dependabot PR #5
    "python-whois>=0.9.6",
    # ⚠️ numpy 2.x 存在大量破坏性变更（np.float/np.int 删除、dtype 转型规则变、切片不兼容），
    #   scikit-learn 1.3.x 也不完整支持 2.x。强锁 <2.0，防止 Dependabot 误开升级 PR。
    #   等 sklearn 最低依赖基线升级到 1.6+ 再考虑放开。
    "numpy>=1.24.0,<2.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.110.0",
    # E1 攻击图统一图模型（networkx 起步，可换 neo4j）
    "networkx>=3.4.0",
    # 跨进程文件锁（core/utils.py _atomic_write_json / Cookie 并发写）：多开扫描时
    # 防止同一目标域 Cookie 文件并发写损坏与丢更新；未安装时静默降级为无锁（仅告警）
    "portalocker>=2.0.0",
]

[project.optional-dependencies]
# T04 依赖可复现（2026-09-15）：dev 工具链锁下限，配合 _runtime_cache/requirements-lock.txt
# （pip freeze 产物，运行时缓存不入库）保证 CI/本地环境可复现。升级需显式改动并跑全量回归。
dev = [
    "ruff>=0.16.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
]
# 高级功能：代码内均为可选导入（try/except ImportError 优雅降级），默认不装、不阻塞 pip install .
#   curl_cffi            -> SP16.2/SP17.3 TLS 指纹伪装（core/impersonate.py）
#   chromadb             -> orchestrator 向量记忆（ai/core.py，import chromadb）
#   tree-sitter / tree_sitter_languages -> SP16.3 调用链 AST 定义表（code/graph.py）
#   fakeredis            -> E6 分布式分片在无 Redis 环境下的模拟后端（distributed/*）
#   uvicorn              -> Dashboard 服务（dashboard/server.py）
full = [
    "curl_cffi>=0.7.0",
    "chromadb>=0.4.0",
    "tree-sitter>=0.21.0",
    "tree_sitter_languages>=1.10.0",
    "fakeredis>=2.20.0",
    "uvicorn>=0.27.0",
]

[project.scripts]
vulnclaw = "vulnclaw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulnclaw" = ["data/**/*", "templates/**/*"]

[tool.ruff]
line-length = 140
target-version = "py311"
cache-dir = "_runtime_cache/ruff"

[tool.ruff.lint]
# T02 lint 门禁（2026-09-15）：
#  - select 与项目现状一致（E4/E7/E9/F 基础语法/未用变量）。
#  - BLE001（盲 except）不做本地全量开启：存量 957 处已登记为技术债务（T15 异常协议迁移），
#    新增裸 except 由 CI 的 "New blind-except gate" 步骤对 PR 变更文件以 --no-config 强制拦截。
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# 根 scan.py 是有意保持的薄壳（布局守卫要求 <=15 行），import 无法按 ruff 分组留空行
"scan.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
cache_dir = "_runtime_cache/pytest"
markers = [
    "integration: exercises a live local or remote target",
    "network: requires outbound network access",
    "docker: requires a running Docker daemon",
]

[tool.coverage.run]
source = ["src/vulnclaw"]

[tool.mypy]
strict = false
ignore_missing_imports = true
