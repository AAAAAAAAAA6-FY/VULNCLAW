# VULNCLAW Fastjson / Log4Shell 真实检出门禁（工作流3）
#
# 触发：push 到 master/main 或任意 PR 时执行；
# 作用：跑 tests/test_fastjson_log4shell.py，对 framework_zero_day_engines 里两个 0day
#       引擎的**带内判定链**做确定性回归（内存 aiohttp 靶场，不依赖 Docker/Vulhub/OOB）：
#         - 漏洞端回显 Lookup 解析值 / fastjson 报错特征 → 必须检出（FN 门禁）
#         - 已修复端返回干净响应 → 不得误报（FP 门禁）
#
# 本地等价命令：
#   pip install -e ".[dev]"
#   PYTHONPATH=src python -m pytest tests/test_fastjson_log4shell.py -q --tb=short
name: vulnclaw-fastjson-log4shell

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fastjson-log4shell:
    name: Fastjson/Log4Shell 真实检出（工作流3）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖（含开发依赖 pytest/pytest-asyncio/aiohttp）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fastjson/Log4Shell 带内判定回归（TP/FN 与 FP 双门禁）
        run: |
          PYTHONPATH=src python -m pytest tests/test_fastjson_log4shell.py -q --tb=short -p no:cacheprovider
