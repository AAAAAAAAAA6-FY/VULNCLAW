# VULNCLAW 请求侧变异/模糊测试门禁（工作流12）
#
# 触发：push 到 master/main 或任意 PR 时执行；
# 作用：跑 tests/test_mutation_fuzzing.py（解析器健壮性 / 规则不被简单绕过 /
#       资源边界），由 scripts/mutation_probe.py 提供零随机、确定性的变异语料。
#       任一用例红即说明"变异输入会令引擎崩溃/被绕过/产生幻影"，作为合入门禁。
#
# 本地等价命令：
#   pip install -e ".[dev]"
#   PYTHONPATH=src python -m pytest tests/test_mutation_fuzzing.py -q --tb=short
name: vulnclaw-mutation-fuzz

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-fuzz:
    name: 请求侧变异/模糊测试（工作流12）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖（含开发依赖 pytest/pytest-asyncio/aiohttp）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 变异/模糊测试
        run: |
          PYTHONPATH=src python -m pytest tests/test_mutation_fuzzing.py -q --tb=short -p no:cacheprovider
