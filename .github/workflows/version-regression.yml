# VULNCLAW 跨版本回归实验室门禁（工作流11）
#
# 触发：push 到 master/main 或任意 PR 时执行；
# 作用：对"版本判定类"引擎跑 易受/修复/边界 三档断言矩阵（内存 aiohttp 靶场，
#       不依赖 Docker/Vulhub），防止版本区间逻辑回归导致误报/漏报影响真实检测。
#
# 本地等价命令：
#   pip install -e ".[dev]"
#   PYTHONPATH=src python -m pytest tests/test_version_regression_matrix.py -q --tb=short
name: vulnclaw-version-regression

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-regression:
    name: 跨版本回归矩阵（工作流11）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖（含开发依赖 pytest/pytest-asyncio/aiohttp）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跨版本回归矩阵（易受/修复/边界三档门禁）
        run: |
          PYTHONPATH=src python -m pytest tests/test_version_regression_matrix.py -q --tb=short -p no:cacheprovider
