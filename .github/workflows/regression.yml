# VULNCLAW 回归质量门禁：全量测试 + 全量 lint
#
# 触发：push 到 master/main 或任意 PR 时执行；
# 作用：pytest 全量跑 + ruff 全量检查（src + tests），任一失败即红，作为合入门禁。
# 本地等价命令：
#   pip install -e ".[dev]"
#   ruff check src tests
#   pytest tests -q
name: vulnclaw-regression

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: pytest + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 安装依赖（含开发依赖 ruff/pytest）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff 静态检查（语法/致命错误级；与 ci.yml 对齐）
        # 存量说明：全量默认规则集（E4,E7,E9,F）当前约 433 项历史违规
        # （F811 重复定义 / E741 歧义名 / F841 未用变量等），一次放开会让门禁长期常红而失效。
        # 此处先只拦"语法/致命"级：E9 = 语法错误、F63x = 无效比较断言、F7xx = 语法类错误。
        # TODO(质量债)：专项 `ruff check --fix` 分批清理后逐步放开 E4/E7/F。
        run: ruff check src tests --select E9,F63,F7

      - name: 全量 pytest
        run: pytest tests -q
