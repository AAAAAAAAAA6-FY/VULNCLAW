name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pytest pytest-cov

      - name: Lint with ruff
        run: ruff check src/vulnclaw --select E9,F63,F7 --statistics

      - name: Run tests
        run: pytest tests/ -q --tb=no --cov=src/vulnclaw --cov-report=term

      - name: Detection benchmark gate (D7.4)
        # 对照基线报告与剧本红线（检出率 recall）验证引擎不退化；
        # 真实靶场报告可由 D7.1 docker-compose 拉起后由 scan.py 生成并替换 --report
        run: |
          python scripts/benchmark.py --mode eval \
            --scenarios-dir scripts/benchmarks \
            --report scripts/benchmarks/baseline_report.json \
            --min-recall 0.8

      - name: Health check
        run: |
          echo "AI_MODEL_CONFIGS={\"zhipu\":{\"api_key\":\"test\"}}" > .env
          python scan.py --health
