# VULNCLAW 平台化能力门禁：风险传播 / Helm Chart / OpenAPI 契约
#
# 触发：push 到 master/main 或任意 PR 时执行；
# 作用：锁死三项平台化交付的确定性行为（全部离线、无需 helm/k8s/docker）：
#   1) 风险传播模型（core/risk_propagation.py）：确定性、衰减单调、资产聚合封顶、
#      confirmed_only 严格口径（绝不拿 suspicious 顶替）；
#   2) Helm Chart 静态验收（deploy/helm/vulnclaw）：探针/资源/环境注入/无硬编码凭据
#      （helm 在 PATH 时追加 helm lint，否则 skip）；
#   3) OpenAPI 契约：dashboard 运行时 spec 覆盖关键端点 + docs/openapi.json 无漂移。
#
# 本地等价命令：
#   pip install -e ".[dev]"
#   PYTHONPATH=src python -m pytest tests/test_risk_propagation.py tests/test_helm_chart.py tests/test_openapi_contract.py -q
#   PYTHONPATH=src python scripts/gen_openapi.py --check
name: vulnclaw-platform-checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-checks:
    name: 平台化能力（风险传播 / Helm / OpenAPI）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 安装依赖（含开发依赖 pytest/pytest-asyncio/fastapi）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 风险传播 + Helm/k8s 静态验收 + OpenAPI 契约 + 互导 CLI
        run: |
          PYTHONPATH=src python -m pytest \
            tests/test_risk_propagation.py \
            tests/test_helm_chart.py \
            tests/test_openapi_contract.py \
            tests/test_io_cli.py \
            -q --tb=short -p no:cacheprovider

      - name: OpenAPI 契约漂移检查（入库件须与运行时一致）
        run: |
          PYTHONPATH=src python scripts/gen_openapi.py --check
