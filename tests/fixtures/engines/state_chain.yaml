# G.1/组 D fixture：状态链/多步漏洞（check 型）正反例。
# 引擎判定：越序直达——阶段端点(/checkout|/admin|/pay|/complete)无前置状态可 2xx 直接访问，
# 而正常流程首步 /login 返回登录页，业务页与登录页差异显著。
module: vulnclaw.engines.state_chain
class: StateChainEngine
engine: state_chain

cases:
  - id: state_order_bypass_checkout
    method: check
    expect: positive
    url: http://127.0.0.1:8080/checkout/confirm
    param: order
    parsed_query: "order=100"
    normal_resp: [200, "<html><body><h1>Confirm your order</h1><p>Please review the following items and confirm payment to complete the purchase.</p><table>...</table></body></html>", {}]
    responses:
      /checkout/confirm:
        status: 200
        body: "<html><body><h1>Confirm your order</h1><p>Please review the following items and confirm payment to complete the purchase.</p><table>...</table></body></html>"
      /login:
        status: 200
        body: "<html><body><h1>Sign in</h1><label>请登录后继续</label></body></html>"
    evidence_contains: "越序直达"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/checkout/confirm'  # 无前置状态直达关键阶段页(对照 /login 差异显著) 越序直达"

  # 越序直达——管理类阶段端点（/admin/ 命中阶段关键字），无登录态直达业务仪表盘
  - id: state_admin_direct_access
    method: check
    expect: positive
    url: http://127.0.0.1:8080/admin/dashboard
    param: menu
    parsed_query: "menu=overview"
    normal_resp: [200, "<html><body><h1>Admin Dashboard</h1><p>Ops overview with active sessions, pending approvals, system metrics and cluster deployment status.</p><table>...</table></body></html>", {}]
    responses:
      /admin/dashboard:
        status: 200
        body: "<html><body><h1>Admin Dashboard</h1><p>Ops overview with active sessions, pending approvals, system metrics and cluster deployment status.</p><table>...</table></body></html>"
      /login:
        status: 200
        body: "<html><body><h1>Sign in</h1><label>请登录后继续</label></body></html>"
    evidence_contains: "越序直达"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/admin/dashboard'  # 无登录态直达管理仪表盘(对照 /login 差异显著) 越序直达"

  # 二次/存储型触发：注入随机 stchain_ 标记至 /profile/update?nick=，消费端点 /messages 回显该标记
  #   （对应 _detect_second_order：marker：stchain_ + 8 位 hex，消费端点 2xx 且命中 _MARKER_RE 才报）
  - id: state_stored_second_order_profile
    method: check
    expect: positive
    url: http://127.0.0.1:8080/profile/update
    param: nick
    parsed_query: "nick=guest"
    normal_resp: [200, "<html><body><h1>Profile</h1><p>edit your display name</p></body></html>", {}]
    responses:
      /profile/update:
        status: 200
        body: "<html><body>profile updated</body></html>"
      /messages:
        status: 200
        body: "<html><body><ul class=feed><li>guest echo: stchain_active 可见</li></ul></body></html>"
    evidence_contains: "存储型二次触发"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/profile/update' --data-urlencode 'nick=stchain_a1b2c3d4'  # 第一步注入存储型标记 stchain_<hex8>\ncurl -sS -m 8 'http://127.0.0.1:8080/messages'  # 第二步消费端点回显该标记(HTTP 200) 存储型二次触发"

  - id: state_protected_flow
    method: check
    expect: negative
    url: http://127.0.0.1:8080/checkout/confirm
    param: order
    parsed_query: "order=100"
    normal_resp: [200, "<html><body>请登录</body></html>", {}]
    responses:
      /checkout/confirm:
        status: 302
        body: ""
    evidence_contains: ""
    reproduction: ""