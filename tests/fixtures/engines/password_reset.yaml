# G.1/组 D fixture：密码重置流程安全（scan 型）正反例。
# 引擎判定：重置端点对不存在的账号返回"不存在"提示可枚举、响应/Location 出现弱重置令牌、
# 重复请求无速率限制。
module: vulnclaw.engines.auth_engines
class: PasswordResetEngine
engine: password_reset

cases:
  - id: reset_user_enum_hint
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      /forgot-password:
        status: 200
        body: "该账号不存在，请检查邮箱"
    evidence_contains: "用户枚举"
    reproduction: "curl -s -X POST 'http://127.0.0.1:8080/forgot-password' --data 'email=nonexist@x.com'  # 返回'账号不存在'提示"

  - id: reset_weak_token
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      /password/reset:
        status: 200
        body: "重置链接: http://127.0.0.1:8080/reset?token=1234"
    evidence_contains: "弱令牌"
    reproduction: "curl -s POST 'http://127.0.0.1:8080/password/reset' --data 'username=alice'  # 回显可预测 token=1234"

  - id: hardened_reset
    expect: negative
    target: http://127.0.0.1:8080
    responses:
      /forgot-password:
        status: 200
        body: "如果该账号存在，重置链接已发送至您的邮箱"
    evidence_contains: ""
    reproduction: ""