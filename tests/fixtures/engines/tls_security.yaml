# G.1 fixture：TLS/SSL 传输层安全检测引擎正反例。
# scan() 目标级：对 host:443 做真实握手，取版本/套件/证书；纯 HTTP 目标或握手失败静默跳过。
# 正例：协商 TLSv1.1（legacy_protocol_enabled）+ RC4 弱套件（weak_cipher）+ 证书无效，
#      一并产出 tls_legacy_protocol_enabled / tls_weak_cipher 两条 finding。
# 反例：TLSv1.3 + AEAD 套件（TLS_AES_128_GCM_SHA256）+ 有效证书 -> 无 finding；纯 HTTP 目标也 skip。
# evidence_contains / reproduction 为深度统计口径字段（组 E 统计脚本读取）。
module: vulnclaw.engines.net_engines
class: TlsSecurityEngine
engine: tls_security

cases:
  - id: legacy_protocol_and_rc4
    expect: positive
    target: https://127.0.0.1:443/
    responses:
      /:
        status: 200
        body: "ok"
    evidence_contains: "服务端仍可与以下已废弃协议完成握手"
    reproduction: "openssl s_client -connect 127.0.0.1:443 -tls1_1 2>&1 </dev/null | head -8  # 服务端接受 TLSv1.1 握手 → tls_legacy_protocol_enabled；openssl s_client -connect 127.0.0.1:443 -cipher RC4-SHA 2>&1 </dev/null | head -8  # RC4 套件可达 → tls_weak_cipher"

  - id: tlsv13_aead_valid_cert
    expect: negative
    target: https://127.0.0.1:443/
    responses:
      /:
        status: 200
        body: "ok"
    evidence_contains: ""
    reproduction: ""

  - id: pure_http_no_tls_service
    expect: negative
    # 目标为纯 HTTP（443 无 TLS 服务、握手失败）-> 引擎静默跳过，不产生误报
    target: http://127.0.0.1:8080/
    responses:
      /:
        status: 200
        body: "ok"
    evidence_contains: ""
    reproduction: ""