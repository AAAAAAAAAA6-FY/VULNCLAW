# G.1 fixture：缓存投毒 / 不安全缓存配置（cache_poison）正反例。
# 引擎逻辑（http_engines.CachePoisonEngine.scan）：
#   - _analyze_cache_headers：Cache-Control 含 public → Medium；含 max-age/s-maxage
#     但缺 no-store/no-cache → 可缓存；两者皆无 → LOW（缺失缓存头）。
#   - 还会对 TEST_HEADERS(X-Forwarded-Host…) 做注入探测、deception/key 污染探测，
#     需响应反射注入值才判定（本 fixture 的静态响应不反射，故不触发）。
module: vulnclaw.engines.http_engines
class: CachePoisonEngine
engine: cache_poison

cases:
  - id: cache_control_public
    method: scan
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      127.0.0.1:8080:
        status: 200
        headers:
          Content-Type: text/html
          Cache-Control: "public, max-age=3600"
        body: "<html><body>static page</body></html>"
    evidence_contains: "Cache-Control"
    reproduction: "curl -sS -m 8 -D - -o /dev/null 'http://127.0.0.1:8080/'  # 响应含 Cache-Control: public, max-age=3600 → 命中「缓存投毒风险-Cache-Control: public」"

  - id: cache_control_no_store
    method: scan
    expect: negative
    target: http://127.0.0.1:8080
    responses:
      127.0.0.1:8080:
        status: 200
        headers:
          Content-Type: text/html
          Cache-Control: "no-store, no-cache, must-revalidate"
        body: "<html><body>static page</body></html>"
    evidence_contains: ""
    reproduction: "fixture 复现（离线 mock）：Cache-Control 为 no-store 且非 public → 期望无任何 finding"

  - id: no_cache_headers
    method: scan
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      127.0.0.1:8080:
        status: 200
        headers:
          Content-Type: text/html
        body: "<html><body>static page</body></html>"
    evidence_contains: "Cache-Control"
    reproduction: "curl -sS -m 8 -D - -o /dev/null 'http://127.0.0.1:8080/'  # 响应缺 Cache-Control/Pragma → 命中「缓存策略未配置-Low」"
