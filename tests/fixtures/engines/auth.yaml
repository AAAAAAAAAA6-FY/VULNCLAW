module: vulnclaw.engines.auth_engines
class: JWTEngine
engine: jwt

target: http://127.0.0.1:8080/api

cases:
  - id: jwt_alg_none
    method: check
    expect: positive
    url: http://127.0.0.1:8080/api
    param: Authorization
    parsed_query: ""
    normal_resp:
      - 200
      - ""
      - Authorization: "Bearer eyJhbGciOiJub25lIn0.eyJzdWIiOiIxMjMifQ."
    responses: {}
    evidence_contains: "发现 2 个问题: alg: none 算法混淆, 缺少过期时间"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/api' --data-urlencode 'Authorization=x' → 期望命中「JWT漏洞」"

  - id: no_jwt_token
    method: check
    expect: negative
    url: http://127.0.0.1:8080/api
    param: Authorization
    parsed_query: ""
    normal_resp:
      - 200
      - '{"message":"ok"}'
      - {}
    responses: {}

