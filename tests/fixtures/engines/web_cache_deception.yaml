# G.1/组 D fixture：Web 缓存欺骗（scan 型）正反例。
# 引擎判定：动态内容经 `<path>/<marker>.css` 伪装路径访问返回同内容(长度比<25%)，且响应
# 带缓存命中证据(x-cache hit / cf-cache-status / age / cache-control public)。
module: vulnclaw.engines.http_advanced_engines
class: WebCacheDeceptionEngine
engine: web_cache_deception

cases:
  - id: cache_deception_profile_hit
    expect: positive
    target: http://127.0.0.1:8080/user/profile
    responses:
      /user/profile:
        status: 200
        body: "<html><body><h1>User Profile</h1><p>email: alice@example.com, plan: pro, session: active, billing: enabled</p></body></html>"
    evidence_contains: "缓存"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/user/profile' && curl -sS -m 8 -D - -o /dev/null 'http://127.0.0.1:8080/user/profile/vlcwcdABC.css'  # .css 伪装路径返回鉴权页同内容 → 命中「Web缓存欺骗」"

  - id: cache_deception_confusion_hit
    expect: positive
    target: http://127.0.0.1:8080/account/billing
    responses:
      /account/billing:
        status: 200
        body: "<html><body><h1>Monthly Billing</h1><p>invoice detail: account 12345, plan pro, amount 99.00 USD, due 2026-10-01</p></body></html>"
    evidence_contains: "缓存"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/account/billing' && curl -sS -m 8 -H 'X-Forwarded-Proto: https' -D - -o /dev/null 'http://127.0.0.1:8080/account/billing/vlcwcdABC.css'  # 步骤2取 .css 伪装路径，若返回鉴权页同内容(长度比<25%)且带 Cache-Control/x-cache HIT → 命中「Web缓存欺骗」"

  - id: cache_deception_denied
    expect: negative
    target: http://127.0.0.1:8080/account/billing
    responses:
      /account/billing:
        status: 404
        body: "<html><body>not found</body></html>"
    evidence_contains: ""
    reproduction: ""