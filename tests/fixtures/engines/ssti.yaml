# G.1 fixture：SSTI 模板注入参数级 check 正反例。
# 正例仅验证"算术表达式被服务端模板引擎求值"（L1），不做 RCE 实锤；
# 负例为普通渲染响应，注入 payload 不产生计算结果。
module: vulnclaw.engines.web_engines
class: SSTIEngine
engine: ssti

cases:
  - id: jinja_arithmetic_reflected
    method: check
    expect: positive
    url: http://127.0.0.1:8080/render
    param: name
    parsed_query: "name=demo"
    normal_resp: [200, "ok", {}]
    responses:
      /render:
        status: 200
        body: "rendered output: 49"
    evidence_contains: "SSTI-L1算术检测"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/render' --data-urlencode 'name=demo' → 期望命中「SSTI-L1算术检测(jinja)」"

  - id: ordinary_template_no_injection
    method: check
    expect: negative
    url: http://127.0.0.1:8080/render
    param: name
    parsed_query: "name=demo"
    normal_resp: [200, "ok", {}]
    responses: {}

