# G.1/组 D fixture：多步序列/并发竞态引擎（SequenceChain，端点级）正反例。
# 引擎判定：按序请求业务链末步由业务 oracle 裁决（2xx 且含成功信号、无失败信号）
# → 报「多步序列业务链可达（Sequence Chain）」，说明缺跨步骤状态/令牌校验；
# 服务端正确校验步骤顺序（乱序被拒 / oracle 失败）→ 不报。
module: vulnclaw.engines.sequence_engines
class: SequenceChainEngine
engine: sequence_chain

cases:
  - id: sequence_chain_skip_guard_bypass
    method: check
    expect: positive
    url: http://127.0.0.1:8080/payflow/complete?step=pay
    param: step
    parsed_query: "step=pay"
    normal_resp: [200, "step=pay accepted", {}]
    responses:
      /payflow/complete:
        status: 200
        body: '{"ok":true,"order_id":"ORD20260915001"}'
    evidence_contains: "业务成功信号"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/payflow/complete?step=pay'  # 跳过前置支付步骤直达末步，被业务 oracle 接受(缺跨步骤状态校验)"

  # 多步序列——"取 token 后改密"业务链（run_sequence 提取变量注入后续步骤，末步 oracle 判定成功）
  - id: sequence_chain_token_pwd_reset
    method: check
    expect: positive
    url: http://127.0.0.1:8080/reset/confirm?step=finalize
    param: step
    parsed_query: "step=finalize"
    normal_resp: [200, "step=finalize accepted", {}]
    responses:
      /reset/confirm:
        status: 200
        body: '{"ok":true,"message":"密码已更新","session":"RS-88213"}'
    evidence_contains: "业务成功信号"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/reset/request'  # 第一步取一次性 token(置状态)\ncurl -sS -m 8 'http://127.0.0.1:8080/reset/confirm?step=finalize'  # 第二步未校验 token 直达改密成功(缺跨步骤一次性令牌校验)"

  # 多步序列——"加购后结算下单"业务链，末步返回业务资源标识 order_id 判成功
  - id: sequence_chain_cart_checkout
    method: check
    expect: positive
    url: http://127.0.0.1:8080/cart/checkout?step=pay
    param: step
    parsed_query: "step=pay"
    normal_resp: [200, "step=pay accepted", {}]
    responses:
      /cart/checkout:
        status: 200
        body: '{"ok":true,"order_id":"ORD20260917003","amount":199}'
    evidence_contains: "业务成功信号"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/cart/add?item=SKU001' && curl -sS -m 8 'http://127.0.0.1:8080/cart/checkout?step=pay'  # 加购->结算->支付下单成功返回 order_id(缺跨步骤状态/金额重校验)"

  - id: sequence_chain_order_enforced
    method: check
    expect: negative
    url: http://127.0.0.1:8080/payflow/complete?step=pay
    param: step
    parsed_query: "step=pay"
    normal_resp: [200, "ok", {}]
    responses:
      /payflow/complete:
        status: 403
        body: '{"error":"invalid sequence order"}'
    evidence_contains: ""
    reproduction: ""

  - id: sequence_chain_locked_no_success
    method: check
    expect: negative
    url: http://127.0.0.1:8080/payflow/complete?step=pay
    param: step
    parsed_query: "step=pay"
    normal_resp: [200, "ok", {}]
    responses:
      /payflow/complete:
        status: 200
        body: "重复提交，流程已锁定"
    evidence_contains: ""
    reproduction: ""