module: vulnclaw.engines.auth_engines
class: IDOREngine
engine: idor

target: http://127.0.0.1:8080/orders?id=1001

cases:
  - id: numeric_object_identifier
    method: check
    expect: positive
    url: http://127.0.0.1:8080/orders?id=1001
    param: id
    parsed_query: "id=1001"
    normal_resp: [200, '{"order_id":1001}', {}]
    responses: {}
    evidence_contains: "发现 ID 参数 id=1001，建议进行越权测试"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/orders' --data-urlencode 'id=1001' → 期望命中「IDOR候选参数」"

  - id: non_identifier_parameter
    method: check
    expect: negative
    url: http://127.0.0.1:8080/search?q=shoes
    param: q
    parsed_query: "q=shoes"
    normal_resp: [200, '{"results":[]}', {}]
    responses: {}

  # ---------- 正例：各类 ID 参数（BOLA 面） ----------
