module: vulnclaw.engines.input_engines
class: FileUploadEngine
engine: file_upload

target: http://127.0.0.1:8080/upload

cases:
  - id: upload_endpoint_candidate
    method: check
    expect: positive
    url: http://127.0.0.1:8080/upload
    param: file
    parsed_query: ""
    normal_resp: [200, "upload form", {}]
    responses: {}
    evidence_contains: "发现文件上传端点: http://127.0.0.1:8080/upload"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/upload' --data-urlencode 'file=x' → 期望命中「文件上传端点发现」"

  - id: ordinary_endpoint_not_upload
    method: check
    expect: negative
    url: http://127.0.0.1:8080/health
    param: name
    parsed_query: ""
    normal_resp: [200, "profile", {}]
    responses: {}

