# G.1/组 D fixture：弱口令/默认凭据（scan 型）正反例。
# 引擎判定：登录端点 Basic/表单默认凭据（admin/admin 等）爆破成功——响应 200 且与
# 401 基线体不同 / 携带成功词（dashboard/welcome/logout/token）。
module: vulnclaw.engines.auth_engines
class: WeakCredentialEngine
engine: weak_credential

cases:
  - id: weak_credential_basic_admin
    expect: positive
    target: http://127.0.0.1:8080/admin
    responses:
      /admin:
        status: 200
        body: "<html>dashboard - welcome admin</html>"
    evidence_contains: "weak_credential_basic"
    reproduction: "curl -s -u admin:admin 'http://127.0.0.1:8080/admin'  # Basic admin/admin 默认凭据登录"

  - id: weak_credential_form_login
    expect: positive
    target: http://127.0.0.1:8080/login
    responses:
      /login:
        status: 302
        body: ""
    evidence_contains: "弱口令"
    reproduction: "fixture 离线复现：表单 admin/123456 登录返回成功跳转/欢迎页"

  - id: hardened_auth
    expect: negative
    target: http://127.0.0.1:8080/login
    responses:
      /login:
        status: 401
        body: "invalid credentials"
    evidence_contains: ""
    reproduction: ""

  - id: weak_credential_iis_admin_staff
    expect: positive
    target: http://127.0.0.1:8080/admin
    responses:
      /admin:
        status: 200
        body: "<html>IIS welcome dashboard - authenticated staff session</html>"
    evidence_contains: "weak_credential_basic"
    reproduction: "curl -s -u admin:'P@ssw0rd' 'http://127.0.0.1:8080/admin'  # Basic admin/P@ssw0rd 默认凭据登录命中欢迎页"

  - id: weak_credential_default_device
    expect: positive
    target: http://127.0.0.1:8080/login
    responses:
      /login:
        status: 302
        body: ""
    evidence_contains: "弱口令"
    reproduction: "fixture 离线复现：设备默认口令 root/123456 表单登录 302 跳转 dashboard"

  - id: weak_credential_lockout_protected
    expect: negative
    target: http://127.0.0.1:8080/login
    responses:
      /login:
        status: 429
        body: "rate limit exceeded, account locked after failed attempts"
    evidence_contains: ""
    reproduction: ""