    evidence_contains: "HKEY_LOCAL_MACHINE"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/xxe' --data-urlencode 'xml=x' → 期望命中「XXE(Linux passwd)」"

