module: vulnclaw.engines.net_engines
class: XXEEngine
engine: xxe

target: http://127.0.0.1:8080/xxe

cases:
  - id: xxe_passwd_disclosure
    method: check
    expect: positive
    url: http://127.0.0.1:8080/xxe
    param: xml
    parsed_query: ""
    normal_resp: [200, "<?xml version=\"1.0\"?><root/>", {}]
    responses:
      /xxe:
        status: 200
        body: "root:x:0:0:root:/root:/bin/bash"
    evidence_contains: "root:x:0:0:root:/root:/bin/bash"
    reproduction: "fixture 复现（离线 mock）：curl -sS --get 'http://127.0.0.1:8080/xxe' --data-urlencode 'xml=x' → 期望命中「XXE(Linux passwd)」"

  - id: ordinary_xml_response
    method: check
    expect: negative
    url: http://127.0.0.1:8080/xxe
    param: xml
    parsed_query: ""
    normal_resp: [200, "<?xml version=\"1.0\"?><root/>", {}]
    responses:
      /xxe:
        status: 200
        body: "request accepted"

  # ---------- 正例：实体回显特征 ----------
