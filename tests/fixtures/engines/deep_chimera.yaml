# G.1/组 D fixture：深藏复合漏洞（check 型）正反例。
# 引擎判定：8 个载荷族注入"多层编码变体"后，强语义回显(marker)或剥壳后 A/B diff 弱信号
# 聚合达阈值即命中（需 ≥1 强家庭或 ≥2 聚合弱家庭）。
# 各正例的 responses.body 是"目标把多层编码载荷还原后的可执行形态"，其中包含的
# MARKERS_BY_FAMILY 字面标记即引擎 _find_semantic_echo 命中点；evidence_contains 均取
# 引擎 finding.evidence 中真实出现的强语义回显 marker 原文，保证统计口径与真实检出一致
# （杜绝"统计自洽但真实检不出"）。响应既有信号时 normal_resp 不含同标记（负基线不泄漏）。
module: vulnclaw.engines.deep_chimera
class: DeepChimeraEngine
engine: deep_chimera

cases:
  # --- 正例（攻击面多样化：不同编码族 / 剥壳还原形态） ---

  - id: deep_chimera_semantic_echo
    method: check
    expect: positive
    url: http://127.0.0.1:8080/echo?q=x
    param: q
    parsed_query: "q=x"
    normal_resp: [200, "plain plasma page", {}]
    responses:
      /echo:
        status: 200
        body: "<h1>result</h1><img src=x onerror=alert(1)><svg/onload=alert(2)>"
    evidence_contains: "<img"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/echo' --data-urlencode \"q=%253Cimg%2520src%253Dx%2520onerror%253Dalert(1)%253E\"  # 双层编码(URL->HTML)剥壳后落回未过滤 HTML 上下文，html_event(<img) 族强回显"

  - id: deep_chimera_script_break_chain
    method: check
    expect: positive
    url: http://127.0.0.1:8080/render?cb=x
    param: cb
    parsed_query: "cb=x"
    normal_resp: [200, "static page skeleton", {}]
    responses:
      /render:
        status: 200
        body: "<div>frame</div></script><script>alert(1)</script><!--"
    evidence_contains: "</script>"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/render' --data-urlencode \"cb=%253C%252Fscript%253E%253Cscript%253Ealert(1)%253C%252Fscript%253E\"  # 双层编码剥壳还原出 </script><script> 逃逸原语，script_break/html_comment 族强回显"

  - id: deep_chimera_json_sql_polyglot
    method: check
    expect: positive
    url: http://127.0.0.1:8080/search?s=x
    param: s
    parsed_query: "s=x"
    normal_resp: [200, "{\"hits\":[]}", {}]
    responses:
      /search:
        status: 200
        body: "SELECT * WHERE name=' OR '1'='1"
    evidence_contains: "' OR '1'='1"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/search' --data-urlencode \"s=%2527%2520OR%2520%25271%2527%253D%25271\"  # JSON->HTML->URL 剥壳后还原为 SQL 语义 ' OR '1'='1，json_sql_polyglot 族强回显"

  - id: deep_chimera_tag_polyglot
    method: check
    expect: positive
    url: http://127.0.0.1:8080/view?t=x
    param: t
    parsed_query: "t=x"
    normal_resp: [200, "leaf template", {}]
    responses:
      /view:
        status: 200
        body: "{{tpl}}<!--&{x}</t>"
    evidence_contains: "</t>"
    reproduction: "curl -sS -m 8 'http://127.0.0.1:8080/view' --data-urlencode \"t=%257B%257Btpl%257D%257D%253C%2521--%2526%257Bx%253C%252Ft%253E\"  # 双层编码剥壳还原出 '{{tpl}}' '<!--&{x</t>' 模板语义破坏，tag_break/tag_polyglot 族强回显"

  # --- 反例（低误报铁律：不应检出） ---

  - id: deep_chimera_no_signal
    method: check
    expect: negative
    url: http://127.0.0.1:8080/echo?q=x
    param: q
    parsed_query: "q=x"
    normal_resp: [200, "plain echo", {}]
    responses:
      /echo:
        status: 200
        body: "plain echo"
    evidence_contains: ""
    reproduction: ""

  - id: deep_chimera_quoted_escape_reflection
    method: check
    expect: negative
    url: http://127.0.0.1:8080/render?cb=x
    param: cb
    parsed_query: "cb=x"
    normal_resp: [200, "static page skeleton", {}]
    responses:
      /render:
        status: 200
        body: "reflected=cb%27value inside double-quote attribute"
    evidence_contains: ""
    reproduction: ""