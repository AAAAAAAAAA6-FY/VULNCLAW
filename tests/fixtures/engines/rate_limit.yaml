# G.1 fixture：登录接口缺少限流/锁定（rate_limit）正反例。
# 引擎逻辑（logic_leak_engines_2.RateLimitEngine.scan）：
#   先 GET base 与 LOGIN_PATHS 找登录页（正文含 password 或状态码 200/405），
#   再对该 URL POST MAX_ATTEMPTS(5) 次错误口令；只要**没有**出现 429 或
#   LOCKOUT_HINTS（rate limit / too many attempts / account locked / captcha / 验证码…）
#   就判定"限流缺失"。
module: vulnclaw.engines.logic_leak_engines_2
class: RateLimitEngine
engine: rate_limit

cases:
  - id: login_405_without_rate_limit
    method: scan
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      /login:
        status: 405
        body: "<html><body><form method=post action=/login><input name=user><input type=password name=pass><button>Login</button></form></body></html>"
    evidence_contains: "限流"
    reproduction: "cmd /c \"for /L %i in (1,1,10) do curl -sS -m 3 -o NUL -X POST -d 'user=admin&pass=wrong' http://127.0.0.1:8080/login\"  # 连续 10 次错误口令均无 429/锁定(均 200/405)，反驳存在限流"

  - id: login_without_rate_limit
    method: scan
    expect: positive
    target: http://127.0.0.1:8080
    responses:
      /login:
        status: 200
        body: "<html><body><form method=post action=/login><input name=username><input type=password name=password><button>Sign in</button></form></body></html>"
    evidence_contains: "限流"
    reproduction: "cmd /c \"for /L %i in (1,1,10) do curl -sS -m 3 -o NUL -X POST -d 'username=admin&password=wrong' http://127.0.0.1:8080/login\"  # 连续 10 次错误口令均返回 200(无 429/锁定)，反驳存在限流"

  # ---------- 反例 ----------
  - id: no_login_endpoint
    method: scan
    expect: negative
    target: http://127.0.0.1:8080
    responses:
      /login:
        status: 404
        body: "<html><body>404 Not Found</body></html>"

  - id: lockout_enforced
    method: scan
    expect: negative
    target: http://127.0.0.1:8080
    responses:
      /login:
        status: 200
        body: "<html><body>Too many attempts. Your account is temporarily locked. Please try again later.</body></html>"

  - id: rate_limited_429_style_body
    method: scan
    expect: negative
    target: http://127.0.0.1:8080
    responses:
      /login:
        status: 200
        body: "<html><body>Rate limit exceeded, please complete the captcha to continue.</body></html>"
