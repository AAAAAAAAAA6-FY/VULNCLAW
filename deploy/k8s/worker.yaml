# Worker：扫描执行（OOB 回调在 worker 侧生效，同 compose 语义）
# 与 deploy/helm/vulnclaw/templates/worker.yaml 语义等价（固定命名，无模板参数）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnclaw-worker
  labels:
    app.kubernetes.io/name: vulnclaw
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vulnclaw
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vulnclaw
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: vulnclaw/vulnclaw:0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--distributed", "--worker", "--redis-url", "redis://vulnclaw-redis:6379/0"]
          env:
            - name: DANGEROUS_MODE
              value: "deny"
            - name: REDIS_URL
              value: "redis://vulnclaw-redis:6379/0"
            - name: OOB_INTERACTSH_SERVER
              value: ""
          envFrom:
            - secretRef:
                name: vulnclaw-secrets
                optional: true
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; redis.Redis.from_url('redis://vulnclaw-redis:6379/0', socket_timeout=3).ping()"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; redis.Redis.from_url('redis://vulnclaw-redis:6379/0', socket_timeout=3).ping()"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 4Gi
              cpu: "3"
          volumeMounts:
            - name: scan-data
              mountPath: /app/_runtime_cache
      volumes:
        - name: scan-data
          persistentVolumeClaim:
            claimName: vulnclaw-worker-scan-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vulnclaw-worker-scan-data
  labels:
    app.kubernetes.io/name: vulnclaw
    app.kubernetes.io/component: worker
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
