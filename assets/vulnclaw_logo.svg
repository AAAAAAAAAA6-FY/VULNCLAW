<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#2e0f08"/>
      <stop offset="45%" stop-color="#180603"/>
      <stop offset="100%" stop-color="#060202"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6d00" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#b3300a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="16%" stop-color="#ffe57f"/>
      <stop offset="38%" stop-color="#ffb300"/>
      <stop offset="64%" stop-color="#ff6d00"/>
      <stop offset="86%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#8e1600"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ffc46b"/>
      <stop offset="35%" stop-color="#e2591b"/>
      <stop offset="75%" stop-color="#8a2408"/>
      <stop offset="100%" stop-color="#5c1504"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#ff9e4a"/>
      <stop offset="50%" stop-color="#c1440e"/>
      <stop offset="100%" stop-color="#6e1a05"/>
    </linearGradient>
    <filter id="blurXL" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="blurM" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glowText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="snakePath" d="M 568 380 C 614 436 420 474 442 566 C 458 640 556 640 566 716 C 572 766 528 780 500 806" fill="none"/>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="420" rx="430" ry="430" fill="url(#halo)"/>

  <!-- faint binary floating in background -->
  <g font-family="Consolas,'Courier New',monospace" font-weight="700" fill="#ff9e4a">
    <text x="140" y="180" font-size="34" opacity="0.12">1</text>
    <text x="210" y="320" font-size="26" opacity="0.10">0</text>
    <text x="120" y="520" font-size="30" opacity="0.11">0</text>
    <text x="240" y="700" font-size="24" opacity="0.10">1</text>
    <text x="160" y="860" font-size="30" opacity="0.12">0</text>
    <text x="880" y="160" font-size="28" opacity="0.12">0</text>
    <text x="820" y="340" font-size="34" opacity="0.11">1</text>
    <text x="905" y="520" font-size="26" opacity="0.10">0</text>
    <text x="860" y="760" font-size="30" opacity="0.12">1</text>
    <text x="760" y="120" font-size="24" opacity="0.10">1</text>
    <text x="320" y="120" font-size="26" opacity="0.10">0</text>
    <text x="700" y="880" font-size="26" opacity="0.10">0</text>
  </g>

  <!-- ===================== BINARY SNAKE (exploit chain) ===================== -->
  <g>
    <!-- outer fire glow of the body -->
    <use xlink:href="#snakePath" stroke="#ff5400" stroke-width="66" filter="url(#blurL)" opacity="0.5"/>
    <!-- dark smooth body under the digits -->
    <use xlink:href="#snakePath" stroke="#240b04" stroke-width="56" filter="url(#blurM)" opacity="0.95"/>
    <!-- the digits themselves -->
    <text font-family="Consolas,'Courier New',monospace" font-size="44" font-weight="700" fill="url(#fire)">
      <textPath xlink:href="#snakePath" href="#snakePath">0100110101100101101101</textPath>
    </text>
    <!-- tail cap -->
    <path d="M 560 387 L 576 373 L 547 355 Z" fill="url(#fire)"/>
    <!-- head -->
    <g>
      <ellipse cx="486" cy="820" rx="31" ry="19" transform="rotate(135 486 820)" fill="url(#metalDark)"/>
      <ellipse cx="486" cy="820" rx="31" ry="19" transform="rotate(135 486 820)" fill="none" stroke="#ffb74d" stroke-width="2" opacity="0.7"/>
      <circle cx="500" cy="801" r="8" fill="#fffdea" filter="url(#blurM)"/>
      <circle cx="500" cy="801" r="6.5" fill="#fff3c4"/>
      <circle cx="500" cy="801" r="3" fill="#d50000"/>
      <path d="M 460 846 l -24 10 M 460 846 l -6 26" stroke="#ff3d00" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- ===================== MECHANICAL FIRE CLAW ===================== -->
  <g>
    <!-- claw under-glow -->
    <g filter="url(#blurXL)" opacity="0.75" fill="#ff6d00">
      <path d="M 468 254 C 428 266 394 292 366 330 L 404 368 C 430 332 460 308 496 298 Z"/>
      <path d="M 362 336 C 328 398 362 498 438 574 C 398 496 396 416 406 360 Z"/>
      <path d="M 496 268 C 490 300 486 330 486 358 L 530 358 C 532 330 532 300 528 268 Z"/>
      <path d="M 482 376 C 458 448 448 540 474 616 C 492 544 512 452 534 376 Z"/>
      <path d="M 556 254 C 596 266 630 292 658 330 L 620 368 C 594 332 564 308 528 298 Z"/>
      <path d="M 662 336 C 700 420 660 552 532 652 C 620 556 628 428 618 360 Z"/>
    </g>

    <!-- mount stem -->
    <rect x="497" y="58" width="30" height="156" rx="14" fill="url(#metal)"/>
    <rect x="504" y="72" width="16" height="128" rx="8" fill="#7a2408" opacity="0.85"/>
    <path d="M 497 104 h 30 M 497 142 h 30" stroke="#5c1504" stroke-width="3"/>

    <!-- upper arms -->
    <g fill="url(#metal)" stroke="#5c1504" stroke-width="2">
      <path d="M 468 254 C 428 266 394 292 366 330 L 404 368 C 430 332 460 308 496 298 Z"/>
      <path d="M 496 268 C 490 300 486 330 486 358 L 530 358 C 532 330 532 300 528 268 Z"/>
      <path d="M 556 254 C 596 266 630 292 658 330 L 620 368 C 594 332 564 308 528 298 Z"/>
    </g>

    <!-- talons -->
    <g fill="url(#metalDark)" stroke="#4a1002" stroke-width="2">
      <path d="M 362 336 C 328 398 362 498 438 574 C 398 496 396 416 406 360 Z"/>
      <path d="M 482 376 C 458 448 448 540 474 616 C 492 544 512 452 534 376 Z"/>
      <path d="M 662 336 C 700 420 660 552 532 652 C 620 556 628 428 618 360 Z"/>
    </g>

    <!-- sharp inner-edge highlights -->
    <g fill="none" stroke="#ffe082" stroke-width="2.5" opacity="0.75" filter="url(#blurM)">
      <path d="M 402 358 C 376 420 384 498 432 562"/>
      <path d="M 494 384 C 476 452 466 544 470 602"/>
      <path d="M 622 360 C 636 432 632 548 546 638"/>
    </g>

    <!-- joints -->
    <g fill="#4a1204" stroke="#ffb74d" stroke-width="3">
      <circle cx="385" cy="349" r="19"/>
      <circle cx="508" cy="372" r="21"/>
      <circle cx="639" cy="349" r="19"/>
    </g>
    <g fill="#2a0a02">
      <circle cx="385" cy="349" r="8"/>
      <circle cx="508" cy="372" r="9"/>
      <circle cx="639" cy="349" r="8"/>
    </g>

    <!-- hub -->
    <circle cx="512" cy="240" r="38" fill="url(#metal)" stroke="#ffb74d" stroke-width="3"/>
    <circle cx="512" cy="240" r="17" fill="#3a0d03" stroke="#ff9100" stroke-width="2"/>
    <circle cx="512" cy="240" r="6" fill="#ffd54f" filter="url(#blurM)"/>
    <g fill="#2a0a02">
      <circle cx="512" cy="213" r="4.5"/>
      <circle cx="489" cy="253" r="4.5"/>
      <circle cx="535" cy="253" r="4.5"/>
    </g>
  </g>

  <!-- sparks at the grip -->
  <g stroke="#ffe082" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
    <path d="M 448 596 l -26 -8"/>
    <path d="M 452 604 l -24 10"/>
    <path d="M 546 668 l 24 14"/>
    <path d="M 540 674 l 12 24"/>
    <path d="M 492 648 l -12 22"/>
  </g>

  <!-- ===================== EMBERS ===================== -->
  <g filter="url(#blurM)">
    <circle cx="180" cy="300" r="3" fill="#ffcc80" opacity="0.9"/>
    <circle cx="242" cy="520" r="4" fill="#ff8f00" opacity="0.85"/>
    <circle cx="152" cy="680" r="3" fill="#ff6d00" opacity="0.6"/>
    <circle cx="302" cy="762" r="5" fill="#ffb300" opacity="0.8"/>
    <circle cx="760" cy="220" r="4" fill="#ffcc80" opacity="0.75"/>
    <circle cx="822" cy="420" r="3" fill="#ff8f00" opacity="0.8"/>
    <circle cx="700" cy="760" r="4" fill="#ff6d00" opacity="0.7"/>
    <circle cx="880" cy="540" r="3" fill="#ffb300" opacity="0.6"/>
    <circle cx="622" cy="120" r="3" fill="#ffe082" opacity="0.85"/>
    <circle cx="402" cy="92" r="4" fill="#ffd54f" opacity="0.8"/>
    <circle cx="940" cy="702" r="4" fill="#ff7043" opacity="0.5"/>
    <circle cx="90" cy="420" r="3" fill="#ff8f00" opacity="0.5"/>
    <circle cx="920" cy="262" r="5" fill="#ffb300" opacity="0.75"/>
    <circle cx="212" cy="152" r="4" fill="#ffd54f" opacity="0.65"/>
    <circle cx="170" cy="600" r="7" fill="#ff6d00" opacity="0.28"/>
    <circle cx="862" cy="362" r="8" fill="#ff8f00" opacity="0.25"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <text x="512" y="940" font-family="'Arial Black','Segoe UI',sans-serif" font-size="86" font-weight="900"
        text-anchor="middle" fill="url(#fire)" filter="url(#glowText)" letter-spacing="8">VULNCLAW</text>
  <text x="512" y="990" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="27" font-weight="600"
        text-anchor="middle" fill="#ffb74d" letter-spacing="10" opacity="0.92">火 爪 · 漏 洞 之 爪</text>
</svg>
