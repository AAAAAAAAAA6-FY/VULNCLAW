<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0%" stop-color="#31100a"/>
      <stop offset="45%" stop-color="#1a0704"/>
      <stop offset="100%" stop-color="#070202"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6d00" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#b3300a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="16%" stop-color="#ffe57f"/>
      <stop offset="38%" stop-color="#ffb300"/>
      <stop offset="64%" stop-color="#ff6d00"/>
      <stop offset="86%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#8e1600"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fff3c4"/>
      <stop offset="100%" stop-color="#ffb74d" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="tongue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff9100" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ff6d00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurXL" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="blurL" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blurM" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="glowText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="460" rx="440" ry="450" fill="url(#halo)"/>

  <!-- ===================== CLAW MARKS ===================== -->
  <g>
    <!-- outer glow copies -->
    <g filter="url(#blurXL)" opacity="0.9" fill="#ff6d00">
      <path d="M 245 185 Q 320 88 395 185 C 425 400 535 640 545 860 C 465 645 298 420 245 185 Z"/>
      <path d="M 407 170 Q 492 62 577 170 C 610 400 755 650 738 880 C 655 645 452 410 407 170 Z"/>
      <path d="M 595 200 Q 665 105 735 200 C 765 410 890 625 880 830 C 812 628 648 425 595 200 Z"/>
    </g>

    <!-- main tapered slashes -->
    <g fill="url(#fire)">
      <path d="M 245 185 Q 320 88 395 185 C 425 400 535 640 545 860 C 465 645 298 420 245 185 Z"/>
      <path d="M 407 170 Q 492 62 577 170 C 610 400 755 650 738 880 C 655 645 452 410 407 170 Z"/>
      <path d="M 595 200 Q 665 105 735 200 C 765 410 890 625 880 830 C 812 628 648 425 595 200 Z"/>
    </g>

    <!-- hot molten cores -->
    <g fill="none" stroke="url(#core)" stroke-width="15" stroke-linecap="round" filter="url(#blurL)" opacity="0.95">
      <path d="M 320 175 C 355 400 485 635 540 845"/>
      <path d="M 492 158 C 528 405 715 645 733 862"/>
      <path d="M 665 190 C 698 415 852 625 875 820"/>
    </g>

    <!-- rim light -->
    <g fill="none" stroke="#ffd54f" stroke-opacity="0.45" stroke-width="2.5" filter="url(#blurM)">
      <path d="M 245 185 Q 320 88 395 185 C 425 400 535 640 545 860"/>
      <path d="M 407 170 Q 492 62 577 170 C 610 400 755 650 738 880"/>
      <path d="M 595 200 Q 665 105 735 200 C 765 410 890 625 880 830"/>
    </g>

    <!-- flame tongues rising from the top caps -->
    <g fill="url(#tongue)">
      <path d="M 320 120 C 300 78 330 52 322 8 C 356 48 352 96 320 120 Z"/>
      <path d="M 262 150 C 248 118 268 100 262 68 C 286 100 282 134 262 150 Z"/>
      <path d="M 380 148 C 368 114 388 96 384 62 C 406 96 400 130 380 148 Z"/>
      <path d="M 492 100 C 470 52 504 24 494 -24 C 532 22 526 76 492 100 Z"/>
      <path d="M 428 132 C 414 98 436 78 430 44 C 456 78 450 114 428 132 Z"/>
      <path d="M 556 134 C 544 100 564 80 560 48 C 582 80 576 116 556 134 Z"/>
      <path d="M 665 142 C 648 104 672 82 664 42 C 694 80 690 120 665 142 Z"/>
      <path d="M 735 168 C 724 138 742 120 738 90 C 758 120 753 150 735 168 Z"/>
    </g>

    <!-- sparks streaking off the claws -->
    <g stroke="#ffe082" stroke-width="3" stroke-linecap="round" opacity="0.75">
      <path d="M 236 120 l 34 -30"/>
      <path d="M 408 100 l 26 -34"/>
      <path d="M 586 78 l 30 -28"/>
      <path d="M 740 96 l 22 -32"/>
      <path d="M 196 260 l 40 -14"/>
      <path d="M 830 220 l 34 -22"/>
    </g>
  </g>

  <!-- ===================== EMBERS ===================== -->
  <g filter="url(#blurM)">
    <circle cx="180" cy="300" r="3" fill="#ffcc80" opacity="0.9"/>
    <circle cx="242" cy="520" r="4" fill="#ff8f00" opacity="0.85"/>
    <circle cx="152" cy="680" r="3" fill="#ff6d00" opacity="0.6"/>
    <circle cx="302" cy="762" r="5" fill="#ffb300" opacity="0.8"/>
    <circle cx="760" cy="220" r="4" fill="#ffcc80" opacity="0.75"/>
    <circle cx="822" cy="420" r="3" fill="#ff8f00" opacity="0.8"/>
    <circle cx="700" cy="760" r="4" fill="#ff6d00" opacity="0.7"/>
    <circle cx="880" cy="540" r="3" fill="#ffb300" opacity="0.6"/>
    <circle cx="622" cy="120" r="3" fill="#ffe082" opacity="0.85"/>
    <circle cx="402" cy="92" r="4" fill="#ffd54f" opacity="0.8"/>
    <circle cx="560" cy="932" r="3" fill="#ff8f00" opacity="0.55"/>
    <circle cx="940" cy="702" r="4" fill="#ff7043" opacity="0.5"/>
    <circle cx="90" cy="420" r="3" fill="#ff8f00" opacity="0.5"/>
    <circle cx="920" cy="262" r="5" fill="#ffb300" opacity="0.75"/>
    <circle cx="762" cy="942" r="3" fill="#ff6d00" opacity="0.5"/>
    <circle cx="212" cy="152" r="4" fill="#ffd54f" opacity="0.65"/>
    <circle cx="170" cy="600" r="7" fill="#ff6d00" opacity="0.28"/>
    <circle cx="862" cy="362" r="8" fill="#ff8f00" opacity="0.25"/>
    <circle cx="500" cy="988" r="7" fill="#ff7043" opacity="0.3"/>
  </g>

  <!-- ===================== TITLE ===================== -->
  <text x="512" y="930" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="116" font-weight="900"
        text-anchor="middle" fill="url(#fire)" filter="url(#glowText)" letter-spacing="14">火爪</text>
  <text x="512" y="984" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="600"
        text-anchor="middle" fill="#ffb74d" letter-spacing="14" opacity="0.9">FIRE CLAW</text>
</svg>
